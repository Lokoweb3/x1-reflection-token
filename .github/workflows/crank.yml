# Tax Vault crank on GitHub Actions: every 10 minutes, one pass of scripts/crank.ts over
# every vault token (collect, sell, burn, liquidity, creator reward, pay holders from the
# published list, fallback payouts). No server needed; anyone can fork the repo and run
# their own. It never publishes lists (that needs the publisher key).
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   secret   CRANK_KEYPAIR  the JSON key file of a wallet made just for this, with ~0.05 XNT
#                           for fees (it earns the crank reward on sales). Never your main wallet.
#   variable CRANK_RPC      optional; default https://rpc.testnet.x1.xyz
#   variable CRANK_PROGRAM  optional; the tax_vault program id (default: the testnet one)
# Without the secret the job skips itself. GitHub may delay scheduled runs by a few minutes.
name: Tax Vault crank

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: tax-vault-crank
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crank:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HAS_KEY: ${{ secrets.CRANK_KEYPAIR != '' }}
    steps:
      - name: Skip without a crank wallet
        if: env.HAS_KEY != 'true'
        run: echo "No CRANK_KEYPAIR secret set; nothing to do."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_KEY == 'true'
        run: npm ci --no-audit --no-fund
      - name: One crank pass over every vault
        if: env.HAS_KEY == 'true'
        env:
          CRANK_KEYPAIR: ${{ secrets.CRANK_KEYPAIR }}
          RPC: ${{ vars.CRANK_RPC || 'https://rpc.testnet.x1.xyz' }}
          PROGRAM: ${{ vars.CRANK_PROGRAM || 'D9jtb7vgd7SAMJeqi97w9mtG8pL7yBizgsChNyb6jHxW' }}
        run: |
          umask 077
          printf '%s' "$CRANK_KEYPAIR" > "$RUNNER_TEMP/crank.json"
          set -o pipefail
          # The pass's report also goes to the run's summary page (Actions -> this run).
          { echo '### Crank pass'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/crank.ts --rpc "$RPC" --keypair "$RUNNER_TEMP/crank.json" --program "$PROGRAM" --all 2>&1 \
            | grep -v DeprecationWarning | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/crank.json"
