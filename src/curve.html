<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curve · 99 + Tax</title>
<style>
:root { --bg: #fbf8ef; --surface-1: #fbf8ef; --line: rgb(29 27 22 / .18); --text-primary: #1d1b16; --text-secondary: #45413a; --text-muted: #6b665a; --link: #1d1b16; --critical: #c8102e; --good: #2f7d32; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font: 15px/1.5 system-ui, sans-serif; }
.topbar { font-size: 13px; text-align: center; padding: 7px 16px; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
.brand { font-size: 24px; text-decoration: none; }
header nav { margin-left: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.wallet { display: flex; align-items: center; gap: 8px; position: relative; }
.wallet-menu { position: absolute; right: 0; top: calc(100% + 6px); padding: 6px; z-index: 5; display: grid; min-width: 180px; }
.wallet-menu button { background: none; border: 0; padding: 8px 12px; text-align: left; cursor: pointer; display: flex; gap: 8px; align-items: center; color: inherit; font: inherit; }
.wallet-menu img { width: 18px; height: 18px; }
h1 { margin: 0 0 6px; font-size: 34px; }
h2 { margin: 0 0 10px; font-size: 20px; }
.lede { color: var(--text-secondary); margin: 0 0 20px; max-width: 760px; }
.card { border: 1px solid var(--line); padding: 18px; margin-bottom: 18px; min-width: 0; }
.muted { color: var(--text-muted); font-size: 13px; }
.btn { font: 700 14px system-ui, sans-serif; padding: 9px 15px; cursor: pointer; border: 2px solid; background: none; color: inherit; text-decoration: none; display: inline-block; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.addr, .mono { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
.error { color: var(--critical); }
.toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto; padding: 10px 14px; z-index: 10; }
.toast[hidden] { display: none; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--line); margin-left: 6px; vertical-align: 2px; white-space: nowrap; }

/* list */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar input { flex: 1; min-width: 180px; padding: 9px 10px; font: inherit; }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; background: none; color: inherit; border: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 26px; }
.ccard { display: flex; flex-direction: column; gap: 10px; text-decoration: none !important; color: inherit; margin: 0; }
.chead { display: flex; gap: 12px; align-items: center; min-width: 0; }
.chead h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
.logo { width: 46px; height: 46px; flex: none; display: grid; place-items: center; overflow: hidden; font-weight: 700; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.logo.big { width: 64px; height: 64px; font-size: 20px; }
.prog { height: 12px; background: var(--rule-soft, rgb(0 0 0 / .1)); position: relative; overflow: hidden; }
.prog > div { position: absolute; inset: 0 auto 0 0; background: var(--red, #c8102e); }
.prog-label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; margin: 0; }
.kv dt { font-size: 12px; }
.kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* create form */
form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
form input, form textarea, form select { padding: 8px 10px; font: inherit; font-weight: 400; width: 100%; }
form textarea { min-height: 70px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hint { font-size: 12px; font-weight: 400; color: var(--text-muted); }
fieldset { margin: 0 0 14px; padding: 12px; min-width: 0; }
.logo-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.logo-row .logo { width: 64px; height: 64px; font-size: 12px; text-align: center; }
.logo-row > div { flex: 1; display: grid; gap: 6px; min-width: 0; }
.costs { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
.costs td { padding: 6px 4px; white-space: normal; }
.costs td:last-child { text-align: right; white-space: nowrap; }
.callout { border: 1.5px dashed var(--red, #c8102e); padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }

/* detail */
.dhead { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.dhead h1 { font-size: 28px; overflow-wrap: anywhere; }
.banner { padding: 12px 14px; margin-bottom: 16px; border: 2px solid var(--ink, #1d1b16); }
.banner.live { border-color: var(--good); }
.banner b { display: block; margin-bottom: 2px; }
.banner .btn { margin-top: 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .axis { stroke: var(--rule, rgb(0 0 0 / .4)); stroke-width: 1; }
.chart .grid-l { stroke: var(--rule-soft, rgb(0 0 0 / .12)); stroke-width: 1; }
.chart .curve-l { fill: none; stroke: var(--red, #c8102e); stroke-width: 2; }
.chart .done-l { fill: none; stroke: var(--red, #c8102e); stroke-width: 4; stroke-linecap: round; }
.chart .now { fill: var(--red, #c8102e); stroke: var(--paper, #fff); stroke-width: 2; }
.chart .cross { stroke: var(--ink-3, #666); stroke-width: 1; stroke-dasharray: 3 3; }
.chart text { font-size: 11px; fill: var(--ink-3, #666); }
.chart-wrap { position: relative; }
.ctip { position: absolute; pointer-events: none; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 3; }
.ctip[hidden] { display: none; }
.seg.tabs { width: 100%; margin-bottom: 12px; }
.seg.tabs button { flex: 1; font-weight: 700; }
.trade label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.trade .inrow { display: flex; gap: 8px; }
.trade input, .trade select { padding: 9px 10px; font: inherit; width: 100%; min-width: 0; }
.quote { font-size: 14px; margin: 4px 0 12px; min-height: 42px; }
.quote b { font-size: 17px; }
.trade .go { width: 100%; padding: 12px; font-size: 15px; }
.bal { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-top: 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--text-muted); }
.num { text-align: right; }
.buy { color: var(--good); font-weight: 700; }
.sell { color: var(--critical); font-weight: 700; }
tr.me td { background: rgb(200 16 46 / .07); }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } header nav { margin-left: 0; } }
@media (max-width: 560px) {
  .row, .row.three { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr 1fr; }
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 28px; }
}
.hint.good { color: var(--good, #2f7d32); }
.hint.bad { color: var(--critical, #b4232f); }
</style>

<body>
<div class="topbar" role="note"><b>Heads up:</b> curve prices move with every trade and nothing is guaranteed. Not financial advice.</div>
<main>
  <header>
    <a class="brand" href="/">99 + Tax</a>
    <nav aria-label="Main">
      <a href="/tokens">Tokens</a>
      <a href="/curve" aria-current="page">Curve</a>
      <a href="/nft">NFTs</a>
      <a href="/analytics">Analytics</a>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/wallet">My earnings</a>
      <a href="/faucet">Faucet</a>
      <a class="btn primary sm" href="/launch">Launch a token</a>
    </nav>
    <div class="wallet" id="walletArea"></div>
  </header>
  <div id="out"><p class="muted">Loading…</p></div>
</main>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script src="/wallet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const W = window.X1Wallet;
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
const link = (href, text, cls) => el("a", { href, target: "_blank", rel: "noopener", text, ...(cls ? { class: cls } : {}) });
const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`;
const units = (v, dec = 9) => Number(BigInt(v ?? 0)) / 10 ** dec;
const fmt = (n, max = 4) => Number(n).toLocaleString(undefined, { maximumFractionDigits: max });
/** Small prices (curve tokens are often fractions of a millionth of an XNT) keep 3 significant digits. */
const sig = (v) => !isFinite(v) ? "–" : v === 0 ? "0" : v < 1 ? v.toFixed(Math.min(14, 2 - Math.floor(Math.log10(v)))).replace(/0+$/, "").replace(/\.$/, "") : v.toLocaleString(undefined, { maximumFractionDigits: v < 100 ? 3 : 0 });
const compact = (v) => Number(v).toLocaleString(undefined, { notation: v >= 1e6 ? "compact" : "standard", maximumFractionDigits: v >= 1e6 ? 2 : 2 });
function ago(unix) {
  const s = Math.max(0, Date.now() / 1000 - unix);
  if (s < 60) return tr("{s}s ago", { s: Math.floor(s) });
  if (s < 3600) return tr("{s}m ago", { s: Math.floor(s / 60) });
  if (s < 86400) return tr("{s}h ago", { s: Math.floor(s / 3600) });
  return tr("{s}d ago", { s: Math.floor(s / 86400) });
}
function logoFor(c, big) {
  const box = el("div", { class: big ? "logo big" : "logo" });
  if (c.image && /^https:\/\//.test(c.image)) box.append(el("img", { src: c.image, alt: "", loading: "lazy" })); else box.textContent = (c.symbol || "?").slice(0, 3);
  return box;
}
const STATUS_TEXT = { trading: tr("On the curve"), complete: tr("Graduating"), "pool-created": tr("Graduating"), graduated: tr("Delivering"), finished: tr("Graduated") };

async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(tr(j.error || r.statusText)); // server messages are English; tr() maps known ones
  return j;
}
let toastTimer;
function toast(kind, ...parts) {
  const t = $("toast"); t.className = `toast ${kind}`; t.replaceChildren(...parts); t.hidden = false;
  clearTimeout(toastTimer); if (kind !== "info") toastTimer = setTimeout(() => { t.hidden = true; }, 12000);
}
async function signAndSend(label, build, curveMint, vaultMint) {
  toast("info", tr("{label}: preparing and simulating…", { label }));
  const { tx, ...rest } = await build();
  toast("info", tr("{label}: approve it in your wallet…", { label }));
  const signed = await W.sign(W.b64ToBytes(tx));
  toast("info", tr("{label}: sending…", { label }));
  const { signature } = await api("/api/send", { tx: W.bytesToB64(signed), curveMint, vaultMint });
  toast("success", tr("{label} confirmed. ", { label }), link(`${info.explorer}/tx/${signature}`, tr("View transaction ↗")));
  return { signature, ...rest };
}

// ---------- curve maths (mirrors src/curve.ts and the on-chain program exactly) ----------
const BPS = 10000n;
const ceilDiv = (a, b) => (a + b - 1n) / b;
function big(state) {
  const o = {};
  for (const k of ["supply", "curveTokens", "virtualXnt", "virtualTokens", "tokensSold", "raisedXnt", "x0", "y0", "targetXnt", "poolTokensNet"]) o[k] = BigInt(state[k]);
  o.createdAt = state.createdAt; o.k0 = o.x0 * o.y0;
  return o;
}
function quoteBuy(c, xntIn, now, feeBps, snipe) {
  const x = c.virtualXnt, y = c.virtualTokens;
  let fee = ceilDiv(xntIn * feeBps, BPS), net = xntIn - fee;
  let out = y - ceilDiv(c.k0, x + net), complete = false;
  if (c.tokensSold + out >= c.curveTokens) {
    out = c.curveTokens - c.tokensSold;
    net = ceilDiv(c.k0, y - out) - x;
    xntIn = ceilDiv(net * BPS, BPS - feeBps);
    fee = xntIn - net; complete = true;
  }
  const maxEarly = (c.supply * BigInt(snipe.maxBps)) / BPS;
  const early = now < c.createdAt + snipe.secs;
  return { xntIn, fee, net, out, complete, tooBigEarly: early && out > maxEarly, zero: out <= 0n, maxEarly, early };
}
function quoteSell(c, tokensIn, feeBps) {
  const x1 = ceilDiv(c.k0, c.virtualTokens + tokensIn);
  const gross = c.virtualXnt - x1;
  const fee = ceilDiv(gross * feeBps, BPS);
  return { gross, fee, out: gross - fee };
}
/** Decimal text ("1.5") to base units, like the server's toBaseUnits; null if it isn't a number. */
function toUnits(text, dec = 9) {
  const m = /^(\d*)(?:\.(\d*))?$/.exec(String(text).trim().replace(/,/g, ""));
  if (!m || (!m[1] && !m[2])) return null;
  const frac = (m[2] ?? "").slice(0, dec).padEnd(dec, "0");
  return BigInt(m[1] || "0") * 10n ** BigInt(dec) + BigInt(frac || "0");
}

let info = null;
const detailMint = (/^\/curve\/([1-9A-HJ-NP-Za-km-z]{32,44})$/.exec(location.pathname) ?? [])[1] ?? null;

// ================= list view =================
let listData = null, filter = "all";
function progressBlock(c) {
  // The bar follows the XNT raised, like its label (tokens sold run a little ahead: the price rises as it fills).
  const pct = Math.min(100, (Number(BigInt(c.raisedXnt) * 10000n / BigInt(c.targetXnt)) / 100) || 0);
  const bar = el("div", { class: "prog", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": pct.toFixed(1), "aria-label": tr("Progress to graduation") },
    el("div", { style: `width:${pct}%` }));
  const label = c.statusCode >= 3 ? tr("{raisedXnt} XNT raised: graduated to XDEX", { raisedXnt: fmt(units(c.raisedXnt), 2) })
    : c.statusCode >= 1 ? tr("{raisedXnt} XNT raised: graduating", { raisedXnt: fmt(units(c.raisedXnt), 2) })
    : `${fmt(units(c.raisedXnt), 2)} / ${fmt(units(c.targetXnt), 0)} XNT to graduation`;
  return el("div", {}, bar, el("div", { class: "prog-label" },
    el("span", { text: label }),
    el("span", { class: "muted", text: `${fmt(pct, 1)}%` })));
}
function curveCard(c) {
  return el("a", { class: "card ccard", href: `/curve/${c.mint}` },
    el("div", { class: "chead" }, logoFor(c),
      el("div", { style: "min-width:0" }, el("h3", {}, c.name, el("span", { class: "tag", text: c.symbol })),
        el("div", { class: "muted", text: `${STATUS_TEXT[c.status] ?? c.status} · ${ago(c.createdAt)}` }))),
    progressBlock(c),
    el("dl", { class: "kv" },
      el("div", {}, el("dt", { class: "muted", text: tr("Price") }), el("dd", { text: `${sig(c.priceXnt)} XNT` })),
      el("div", {}, el("dt", { class: "muted", text: tr("Market cap") }), el("dd", { text: `${compact(units(c.marketCapXnt))} XNT` })),
      el("div", {}, el("dt", { class: "muted", text: tr("Tax after") }), el("dd", { text: `${c.taxBps / 100}%` }))));
}
function renderList() {
  const q = ($("q")?.value ?? "").trim().toLowerCase();
  let list = listData.curves.filter((c) => !q || [c.name, c.symbol, c.mint].some((s) => String(s).toLowerCase().includes(q)));
  if (filter === "soon") list = list.filter((c) => c.status === "trading").sort((a, b) => b.progress - a.progress);
  else if (filter === "new") list = list.filter((c) => c.status === "trading").sort((a, b) => b.createdAt - a.createdAt);
  else if (filter === "graduated") list = list.filter((c) => c.statusCode >= 1);
  const host = $("list");
  if (list.length) host.replaceChildren(el("div", { class: "grid" }, ...list.map(curveCard)));
  else if (!listData.curves.length) host.replaceChildren(siteEmpty(tr("No curve tokens yet on this network."), { href: "#create", text: tr("Create the first one →") }));
  else host.replaceChildren(el("p", { class: "muted", text: q ? tr("No curve token matches that search.") : tr("Nothing here yet.") }));
  for (const b of document.querySelectorAll("#filters button")) b.setAttribute("aria-pressed", String(b.dataset.f === filter));
}

function listView() {
  const seg = el("div", { class: "seg", id: "filters", role: "group", "aria-label": tr("Filter curves") },
    ...[["all", tr("All")], ["soon", tr("About to graduate")], ["new", tr("New")], ["graduated", tr("Graduated")]].map(([f, t]) => {
      const b = el("button", { type: "button", "data-f": f, text: t, "aria-pressed": String(f === filter) });
      b.onclick = () => { filter = f; renderList(); };
      return b;
    }));
  const search = el("input", { id: "q", type: "search", placeholder: tr("Search by name, symbol or address"), "aria-label": tr("Search curve tokens") });
  search.addEventListener("input", renderList);
  $("out").replaceChildren(
    el("h1", { text: tr("Bonding curve") }),
    el("p", { class: "lede" }, tr("Launch with no starting liquidity. Buyers fill a price curve with XNT; when the curve's target is raised ("),
      el("b", { text: `${targetList()} XNT` }),
      tr(", the creator picks), the curve graduates: it creates the XDEX pool with that XNT, locks the liquidity forever, and every buyer receives their tokens. From then on it's a normal 99 + Tax token paying its holders.")),
    el("div", { class: "toolbar" }, seg, search),
    el("div", { id: "list" }),
    createForm());
  renderList();
  setupLogo();
  renderCosts();
}

// ---------- create form ----------
const MAX_LP_PLUS_BURN = 55; // 10% goes to the creator; holders keep at least 35%
/** Graduation targets a new curve can pick (whole XNT); each curve shows its own afterwards. */
const targetsOf = () => listData?.params?.targetsXnt ?? ["500", "1000", "3000", "5000", "10000"];
const targetList = () => { const t = targetsOf().map((v) => fmt(v, 0)); return tr("{low} to {high}", { low: t[0], high: t.at(-1) }); };
/**
 * create_curve's setup (src/curve.ts curveSetup): the curve's start price and its end price,
 * which is the XDEX pool's opening price (the target against the pool's tokens after tax).
 */
function setupPrices(supplyWhole, taxBps, targetWhole) {
  const S = BigInt(supplyWhole) * 10n ** 9n, T = (S * 8000n) / BPS, Pg = S - T;
  const Pn = Pg - ceilDiv(Pg * BigInt(taxBps), BPS);
  if (Pn <= 0n || T <= Pn) return null;
  const a = (Pn * T) / (T - Pn), R = BigInt(targetWhole) * 10n ** 9n;
  const x0 = (R * (a - Pn)) / Pn, y0 = a + T;
  return { start: Number(x0) / Number(y0), end: Number(R) / Number(Pn) };
}
function createForm() {
  const p = listData.params;
  const f = el("form", { id: "createForm", autocomplete: "off" },
    el("div", { class: "row" },
      el("label", {}, tr("Name"), el("input", { name: "name", maxlength: "32", required: "", placeholder: tr("My Token") })),
      el("label", {}, tr("Symbol"), el("input", { name: "symbol", maxlength: "10", required: "", placeholder: "MYT", pattern: "[A-Za-z0-9$._\\-]+" }))),
    el("div", { class: "logo-row" }, el("div", { class: "logo", id: "logoPreview", "aria-live": "polite", text: tr("No logo") }),
      el("div", {},
        el("label", { class: "btn sm", id: "logoUploadBtn", hidden: "" }, tr("Upload image"),
          el("input", { type: "file", id: "logoFile", accept: "image/png,image/jpeg,image/webp,image/gif", hidden: "" })),
        el("label", {}, tr("…or paste a link"), el("input", { name: "image", placeholder: tr("https://… or ipfs://…") })),
        el("span", { class: "hint", id: "logoHint", text: tr("Square PNG, 512×512 recommended (JPG, WebP or GIF also work; no SVG).") }))),
    el("label", { style: "margin-bottom:12px" }, tr("Description"), el("textarea", { name: "description", maxlength: "500", placeholder: tr("What is this token?") })),
    el("div", { class: "row three" },
      el("label", {}, tr("Website "), el("span", { class: "hint", text: tr("(optional)") }), el("input", { name: "website", type: "url", placeholder: "https://…", maxlength: "200" })),
      el("label", {}, tr("X (Twitter) "), el("span", { class: "hint", text: tr("(optional)") }), el("input", { name: "twitter", type: "url", placeholder: "https://x.com/…", maxlength: "200" })),
      el("label", {}, tr("Telegram "), el("span", { class: "hint", text: tr("(optional)") }), el("input", { name: "telegram", type: "url", placeholder: "https://t.me/…", maxlength: "200" }))),
    el("fieldset", {}, el("legend", { text: tr("Supply and tax") }),
      el("div", { class: "row" },
        el("label", {}, tr("Total supply"),
          el("select", { name: "supply", id: "supplyPick" }, ...supplyPresets(p).map(([v, t]) => {
            const o = el("option", { value: v, text: t });
            if (v === "1000000000") o.setAttribute("selected", "");

/** Price vs XNT raised, drawn from the curve: at raised r, x = x0 + r and price = x² / k0. */
function chart(v) {
  const c = big(v.state);
  // Phones get a narrower drawing, so its text isn't scaled down to nothing.
  const narrow = innerWidth < 560;
  const W0 = narrow ? 360 : 600, H0 = narrow ? 240 : 260, L = 64, R = 12, T = 26, B = 34;
  // Curve prices are tiny fractions of an XNT: axis labels use exponents to stay short.
  const axis = (p) => p === 0 ? "0" : p < 0.001 ? p.toExponential(2) : sig(p);
  const target = Number(c.targetXnt);
  const x0 = Number(c.x0), k0 = Number(c.k0);
  const price = (r) => ((x0 + r) * (x0 + r)) / k0;
  const pMax = price(target) * 1.04;
  const X = (r) => L + (r / target) * (W0 - L - R);
  const Y = (p) => T + (1 - p / pMax) * (H0 - T - B);
  const pts = [], N = 80;
  for (let i = 0; i <= N; i++) { const r = (target * i) / N; pts.push(`${X(r).toFixed(1)},${Y(price(r)).toFixed(1)}`); }
  const raised = Math.min(Number(c.raisedXnt), target);
  const donePts = pts.filter((_, i) => (target * i) / N <= raised).concat(`${X(raised).toFixed(1)},${Y(price(raised)).toFixed(1)}`);
  const s = svg("svg", { viewBox: `0 0 ${W0} ${H0}`, class: "chart", role: "img", "aria-label": tr("Price rises from {start} to {end} XNT per token as {target} XNT is raised; now {now} XNT at {raised} XNT raised.", { start: sig(price(0)), end: sig(price(target)), target: fmt(target / 1e9, 0), now: sig(price(raised)), raised: fmt(raised / 1e9, 2) }) });
  for (const f of [0, 0.5, 1]) {
    const p = pMax * f / 1.04 * (f === 0 ? 0 : 1);
    s.append(svg("line", { class: "grid-l", x1: L, x2: W0 - R, y1: Y(p), y2: Y(p) }), svg("text", { x: L - 6, y: Y(p) + 4, "text-anchor": "end", text: axis(p) }));
  }
  s.append(svg("line", { class: "axis", x1: L, x2: W0 - R, y1: H0 - B, y2: H0 - B }));
  for (const f of narrow ? [0, 0.5, 1] : [0, 0.25, 0.5, 0.75, 1]) s.append(svg("text", { x: X(target * f), y: H0 - B + 16, "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle", text: fmt(target * f / 1e9, 1) }));
  s.append(svg("text", { x: (L + W0 - R) / 2, y: H0 - 3, "text-anchor": "middle", text: tr("XNT raised") }));
  s.append(svg("text", { x: 4, y: 12, text: tr("XNT per token"), "text-anchor": "start" }));
  s.append(svg("polyline", { class: "curve-l", points: pts.join(" "), opacity: ".45" }));
  if (raised > 0) s.append(svg("polyline", { class: "done-l", points: donePts.join(" ") }));
  s.append(svg("circle", { class: "now", cx: X(raised), cy: Y(price(raised)), r: 6 }));
  // Hover: crosshair and a tooltip with the price at that point of the curve.
  const cross = svg("line", { class: "cross", y1: T, y2: H0 - B, visibility: "hidden" });
  const dot = svg("circle", { class: "now", r: 4, visibility: "hidden" });
  const hit = svg("rect", { x: L, y: T, width: W0 - L - R, height: H0 - T - B, fill: "transparent" });
  s.append(cross, dot, hit);
  const tip = el("div", { class: "ctip", hidden: "" });
  const move = (ev) => {

    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.textContent = tr("{raised} XNT raised · {price} XNT per token", { raised: fmt(r / 1e9, 2), price: sig(price(r)) });
    const left = (cx / W0) * box.width;
    tip.style.left = `${Math.max(0, Math.min(box.width - tip.offsetWidth, left - tip.offsetWidth / 2))}px`;

        ready = true;
        put(quote, el("div", {}, tr("You get ≈ "), el("b", { text: `${fmt(units(q.out), 2)} ${v.symbol}` })),
          el("div", { class: "muted", text: tr("Pay {xntIn} XNT incl. {feeBps}% fee ({fee} XNT). At least {min} {symbol} or it cancels.", { xntIn: fmt(units(q.xntIn), 6), feeBps: v.params.feeBps / 100, fee: fmt(units(q.fee), 6), min: fmt(units(min), 2), symbol: v.symbol }) }),
          q.complete ? el("div", { class: "muted", text: tr("This buy fills the curve: you only pay for what's left, and it graduates.") }) : null,
          v.wallet && !v.wallet.hasPosition && v.firstBuyExtraXnt ? el("div", { class: "muted", text: tr("First buy: about {firstBuyExtraXnt} XNT more for your curve balance and a token-account deposit (the unused deposit is refunded at delivery).", { firstBuyExtraXnt: fmt(units(v.firstBuyExtraXnt), 4) }) }) : null);
      }
    } else {
      if (units9 > balance) why = tr("That's more than your curve balance ({balance} {symbol}).", { balance: fmt(units(balance), 2), symbol: v.symbol });
      else {
        const q = quoteSell(c, units9, feeBps);
        const min = (q.out * (10000n - BigInt(slip.value))) / 10000n;
        if (q.out <= 0n) why = tr("That amount is too small to sell.");
        else {
          ready = true;
          put(quote, el("div", {}, tr("You get ≈ "), el("b", { text: `${fmt(units(q.out), 6)} XNT` })),
            el("div", { class: "muted", text: tr("After the {feeBps}% fee ({fee} XNT). At least {min} XNT or it cancels.", { feeBps: v.params.feeBps / 100, fee: fmt(units(q.fee), 6), min: fmt(units(min), 6) }) }));
        }
      }
    }
    if (why) quote.append(el("div", { class: "muted", text: why }));
    go.disabled = tradeBusy || (!!me && !ready) || !trading || (isCreator && !v.params?.creatorCanBuy);
    go.textContent = !me ? tr("Connect wallet") : tradeBusy ? tr("Working…") : tab === "buy" ? tr("Buy {symbol}", { symbol: v.symbol }) : tr("Sell {symbol}", { symbol: v.symbol });
  }
  amount.addEventListener("input", update);
  slip.addEventListener("change", update);
  if (maxBtn) maxBtn.onclick = () => { amount.value = (Number(balance) / 1e9).toString(); tradeInputs.sellAll = true; update(); };
  amount.addEventListener("input", () => { tradeInputs.sellAll = false; });
  go.onclick = async (ev) => {
    if (!me) { openWalletMenu(ev); return; }
    tradeBusy = true; update();
    try {
      const body = { wallet: me, mint: v.mint, slippageBps: Number(slip.value) };
      if (tab === "buy") await signAndSend(tr("Buy"), () => api("/api/curve/buy", { ...body, xnt: amount.value.trim() }), v.mint);
      else await signAndSend(tr("Sell"), () => api("/api/curve/sell", { ...body, tokens: tradeInputs.sellAll ? "all" : amount.value.trim() }), v.mint);
      tradeInputs[tab] = ""; tradeInputs.sellAll = false;
    } catch (e) { toast("error", tr("{action} failed: {message}", { action: tab === "buy" ? tr("Buy") : tr("Sell"), message: e.message || e })); }
    tradeBusy = false;
    await loadDetail();
  };
  update();
  const inputRow = el("div", { class: "inrow" }, amount, maxBtn);
  return el("section", { class: "card trade" },
    el("h2", { text: tr("Trade on the curve") }), tabs,
    el("label", {}, tab === "buy" ? tr("XNT to spend") : tr("{symbol} to sell", { symbol: v.symbol }), inputRow),
    el("label", {}, tr("Slippage"), slip),
    quote, go,
    el("div", { class: "bal" }, el("span", { class: "muted", text: tr("Your curve balance") }),
      el("b", { text: me ? `${fmt(units(balance), 2)} ${v.symbol}` : "–" })),
    el("p", { class: "muted", style: "margin:8px 0 0", text: tr("Balances stay on the curve until it graduates; then the tokens are sent to your wallet automatically. No tax on the curve.") }));
}
const tradeInputs = {};

function tradesTable(v) {
  if (!v.trades.length) return el("p", { class: "muted", text: tr("No trades yet.") });
  return el("div", { class: "table-wrap" }, el("table", {},
    el("tr", {}, ...[tr("Time"), tr("Side"), tr("Wallet"), "XNT", tr("Tokens"), tr("Price")].map((h, i) => el("th", { class: i >= 3 ? "num" : "", text: h }))),
    ...v.trades.map((t) => el("tr", { class: t.trader === W.state.address ? "me" : "" },
      el("td", {}, link(`${info.explorer}/tx/${t.sig}`, ago(t.ts))),
      el("td", { class: t.isBuy ? "buy" : "sell", text: t.isBuy ? tr("Buy") : tr("Sell") }),
      el("td", {}, el("a", { href: `/wallet/${t.trader}`, class: "mono", text: short(t.trader) })),
      el("td", { class: "num", text: fmt(units(t.xnt), 4) }),
      el("td", { class: "num", text: compact(units(t.tokens)) }),
      el("td", { class: "num", text: sig(t.priceAfter) })))));
}
function holdersTable(v) {
  if (!v.holders.length) return el("p", { class: "muted", text: v.statusCode >= 4 ? tr("Every balance has been delivered; see the token's holders on its leaderboard.") : tr("No buyers yet.") });
  return el("div", { class: "table-wrap" }, el("table", {},
    el("tr", {}, el("th", { text: "#" }), el("th", { text: tr("Wallet") }), el("th", { class: "num", text: tr("Tokens") }), el("th", { class: "num", text: tr("% of supply") })),
    ...v.holders.slice(0, 100).map((h, i) => el("tr", { class: h.owner === W.state.address ? "me" : "" },
      el("td", { text: String(i + 1) }),
      el("td", {}, el("a", { href: `/wallet/${h.owner}`, class: "mono", text: short(h.owner) })),
      el("td", { class: "num", text: compact(units(h.balance)) }),
      el("td", { class: "num", text: `${fmt(h.pctSupply, 2)}%` })))));
}

function renderDetail() {
  const v = view;
  const focused = document.activeElement?.id === "amt";
  const out = $("out");
  const parts = [
    el("p", { style: "margin:0 0 10px" }, el("a", { href: "/curve", text: tr("← All curve tokens") })),
    el("div", { class: "dhead" }, logoFor(v, true),
      el("div", { style: "min-width:0" }, el("h1", {}, v.name, el("span", { class: "tag", text: v.symbol }), el("span", { class: "tag", text: STATUS_TEXT[v.status] ?? v.status })),
        el("div", { class: "muted" }, link(`${info.explorer}/address/${v.mint}`, short(v.mint), "mono"), tr(" · created {createdAt} · by ", { createdAt: ago(v.createdAt) }),
          el("a", { href: `/wallet/${v.creator}`, class: "mono", text: short(v.creator) })))),
    v.description ? el("p", { class: "lede", text: v.description }) : null,
    banner(v),
    vaultStart(v),
    el("div", { class: "card" }, progressBlock(v),
      el("dl", { class: "kv", style: "margin-top:12px" },
        el("div", {}, el("dt", { class: "muted", text: tr("Price") }), el("dd", { text: `${sig(v.priceXnt)} XNT` })),
        el("div", {}, el("dt", { class: "muted", text: tr("Market cap") }), el("dd", { text: `${compact(units(v.marketCapXnt))} XNT` })),
        el("div", {}, el("dt", { class: "muted", text: tr("Tax after graduation") }), el("dd", { text: `${v.taxBps / 100}%` })),
        el("div", {}, el("dt", { class: "muted", text: tr("Sold") }), el("dd", { text: `${compact(units(v.tokensSold))} / ${compact(units(v.curveTokens))}` })),
        el("div", {}, el("dt", { class: "muted", text: tr("Pool opening price") }), el("dd", { text: `${sig(Number(v.state.targetXnt) / Number(v.state.poolTokensNet))} XNT` })),
        el("div", {}, el("dt", { class: "muted", text: tr("Buyers") }), el("dd", { text: String(v.holderCount) }))),
      el("div", { class: "muted", style: "margin-top:8px;display:flex;gap:14px;flex-wrap:wrap" },
        ...[["website", tr("Website")], ["twitter", "X"], ["telegram", tr("Telegram")]].filter(([k]) => v.links?.[k]).map(([k, l]) => link(v.links[k], `${l} ↗`)))),
    el("div", { class: "cols" },
      el("section", { class: "card" }, el("h2", { text: tr("Price curve") }),
        el("p", { class: "muted", style: "margin:-4px 0 8px", text: tr("The price rises as XNT comes in. At the end of the curve it matches the XDEX pool's opening price.") }),
        chart(v)),
      tradeBox(v)),
    el("section", { class: "card" }, el("h2", { text: tr("Recent trades") }), tradesTable(v)),
    el("section", { class: "card" }, el("h2", { text: tr("Curve balances") }), holdersTable(v))];
  out.replaceChildren(...parts.filter(Boolean)); // no banner or description: leave them out, not "null"
  if (focused) { const a = $("amt"); a?.focus(); a?.setSelectionRange(a.value.length, a.value.length); }
}

async function loadDetail() {
  try {
    const v = await api(`/api/curve/${detailMint}${W.state.address ? `?wallet=${W.state.address}` : ""}`);
    view = v; fetchedAt = Date.now();
    document.title = tr("{name} ({symbol}) · Curve · 99 + Tax", { name: v.name, symbol: v.symbol });
    if (!tradeBusy) renderDetail();
  } catch (e) {
    if (!view) $("out").replaceChildren(el("p", {}, el("a", { href: "/curve", text: tr("← All curve tokens") })), el("p", { class: "error", text: tr("Couldn't load this curve: {message}", { message: e.message || e }) }));
  }
}

// ---------- wallet ----------
function renderWallet() {
  const area = $("walletArea");
  if (W.state.address) {
    const b = el("button", { class: "btn", type: "button", text: tr("Disconnect") });
    b.onclick = () => W.disconnect();
    area.replaceChildren(el("span", { class: "addr", text: short(W.state.address) }), b);
  } else {
    const b = el("button", { class: "btn primary", type: "button", text: tr("Connect wallet") });
    b.onclick = openWalletMenu;
    area.replaceChildren(b);
  }
}
function openWalletMenu(ev) {
  ev?.stopPropagation();
  $("walletMenu")?.remove();
  const choices = W.choices();
  const go = (c) => W.connect(c).catch((e) => toast("error", tr("Wallet connection failed: ") + (e.message || e)));
  if (!choices.length) { toast("error", tr("No wallet found. Install a Solana-compatible wallet such as X1 Wallet or Backpack, then reload.")); return; }
  if (choices.length === 1) { go(choices[0]); return; }
  const menu = el("div", { class: "wallet-menu", id: "walletMenu" });
  for (const c of choices) {
    const b = el("button", { type: "button" });
    if (typeof c.icon === "string" && c.icon.startsWith("data:image/")) b.append(el("img", { src: c.icon, alt: "" }));
    b.append(c.name);
    b.onclick = () => { menu.remove(); go(c); };
    menu.append(b);
  }
  $("walletArea").append(menu);
}
document.addEventListener("click", () => $("walletMenu")?.remove());
W.onChange(() => { renderWallet(); if (detailMint) loadDetail(); else renderCosts(); });
renderWallet();

(async () => {
  try { info = await api("/api/info"); } catch { info = { explorer: "" }; }
  if (detailMint) {
    await loadDetail();
    setInterval(() => { if (!document.hidden && !tradeBusy) loadDetail(); }, 15000);
    return;
  }
  try {
    listData = await api("/api/curves");
    listView();
    if (location.hash === "#create") $("create")?.scrollIntoView();
    setInterval(async () => {
      if (document.hidden) return;
      try { listData = { ...listData, curves: (await api("/api/curves")).curves }; renderList(); } catch { /* keep the last list */ }
    }, 20000);
  } catch (e) { $("out").replaceChildren(el("p", { class: "error", text: tr("Couldn't load curve tokens: {message}", { message: e.message || e }) })); }
})();
</script>
</body>
