<style>

* { box-sizing: border-box; }

.search input { flex: 1; min-width: 0; background: rgb(0 0 0 / .35); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text-primary); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }

.view { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }

.wd-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }

.toast.error { border-left-color: var(--critical); }

@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .view { grid-template-columns: 1fr; } header nav { margin-left: 0; } }
.stats-card { margin-top: 28px; padding: 22px; }

.panel { background: rgb(0 0 0 / .25); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

.metric .v { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.yield-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: center; margin-bottom: 12px;
  border-color: rgb(182 255 59 / .45); box-shadow: 0 0 22px -10px rgb(182 255 59 / .6); }
.yield-panel .v { font-size: 24px; font-weight: 700; color: var(--lime); font-variant-numeric: tabular-nums; }
.yield-panel .k { color: var(--text-muted); font-size: 12px; }
.yield-panel .n { color: var(--text-muted); font-size: 12px; }
.yield-panel .why { color: var(--text-secondary); font-size: 12px; }
.mine-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border-color: rgb(255 62 165 / .5); box-shadow: 0 0 22px -8px rgb(255 62 165 / .6); margin-bottom: 12px; }
.mine-strip .title { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.bar { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
.bar span { display: block; height: 100%; min-width: 2px; }

.brk li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13px; }
.brk i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.brk .amt { font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; text-align: right; }
.brk .pct { color: var(--text-muted); font-weight: 400; margin-left: 6px; }
.brk .lab { color: var(--text-secondary); }
.chart-panel { margin-bottom: 12px; }
.chart-box { position: relative; }
.chart-box { min-height: 190px; }
.chart-box svg { display: block; }
.chart-box svg text { fill: var(--text-muted); font: 11px Inter, system-ui, sans-serif; }
.ctip { position: absolute; pointer-events: none; background: #15121f; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; white-space: nowrap; z-index: 3; }
.hold-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.hold-head h2 { font-size: 20px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.chip b { color: var(--text-primary); }
.table-wrap { overflow-x: auto; }
.holders { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.holders th, .holders td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.holders th { color: var(--text-muted); font-size: 12px; font-weight: 600; }
.holders .num { text-align: right; }
.holders tr.me td { background: rgb(255 62 165 / .08); }
.share { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.share span { display: block; height: 100%; background: var(--s-hold); }
.lbl { font-size: 11px; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 6px; color: var(--text-secondary); }
.st { font-size: 12px; font-weight: 600; }
.st.earning { color: var(--lime); }
.st.excluded, .st.program, .st.sold { color: var(--text-muted); }
.st.below-minimum { color: var(--warning); }
.more { margin-top: 12px; }
@media (max-width: 860px) {
  .hero-row, .mine-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .yield-panel { grid-template-columns: minmax(0, 1fr); }
  .hero-row .price { grid-column: 1 / -1; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
header nav a[aria-current="page"] { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 6px; }

<body>
<div class="topbar" role="note"><b>Heads up:</b> crypto is highly volatile and nothing is guaranteed. Not financial advice.</div>
<main>
  <header>
    <a class="brand" href="/">99 + Tax</a>
    <nav aria-label="Main"><a href="/tokens">Tokens</a><a href="/nft" aria-current="page">NFTs</a><a href="/analytics">Analytics</a><a href="/wallet">My earnings</a><a href="/launch">Launch app</a></nav>
    <div class="wallet" id="walletArea"></div>
  </header>
  <form class="search" id="search">
    <input id="mintInput" placeholder="LP-lock NFT address" aria-label="LP-lock NFT address" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">View NFT</button>
  </form>
  <div id="out"></div>
</main>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script src="/wallet.js"></script>
<script src="/countdown.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const W = window.X1Wallet;
let current = null; // the NFT on screen
let busy = false;
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
const link = (href, text, cls) => el("a", { href, target: "_blank", rel: "noopener", text, ...(cls ? { class: cls } : {}) });
const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`;

async function show(mint, quiet = false) {
  const out = $("out");
  if (current?.nftMint !== mint) { current = { nftMint: mint }; holdersShown = 25; } // single-NFT view from here on
  if (!quiet) out.replaceChildren(el("p", { class: "muted", text: "Reading the NFT from the chain…" }));
  try {
    const r = await fetch(`/api/nft/${encodeURIComponent(mint)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    document.title = `${d.name} · 99 + Tax`;
    const addr = (a) => link(`${d.explorer}/address/${a}`, short(a), "mono");
    const rows = [
      ["Token", el("span", {}, `${d.tokenName} (${d.symbol}) `, addr(d.tokenMint))],
      ["LP locked", `${d.lockedLp} LP · ${d.lpSharePct.toFixed(2)}% of the pool`],
      ["Lock", d.term === "FOREVER" ? "Forever, can never be withdrawn" : d.term.replace(/^UNTIL/, "Until")],
      ["Locked at", d.lockedAt],
      ["Tax", d.split ? `${d.taxPct}%: ${d.split.holders}% holders · ${d.split.liquidity}% liquidity · ${d.split.burn}% burn · ${d.split.creator}% creator` : `${d.taxPct}%`],
      ["Held by", d.holder ? addr(d.holder) : "Nobody (burned)"],
      ["NFT", addr(d.nftMint)],
      ["Lock account", addr(d.lock)],
    ];
    const img = el("img", { src: d.image, alt: `${d.name} receipt: ${d.lockedLp} LP locked ${d.term.toLowerCase()}, locked at ${d.lockedAt}` });
    const download = el("a", { class: "btn", href: d.image, download: `${d.symbol}-lp-lock-${d.nftMint.slice(0, 8)}.svg`, text: "Download image" });
    const copy = el("button", { class: "btn", type: "button", text: "Copy link" });
    copy.onclick = async () => { try { await navigator.clipboard.writeText(location.href); copy.textContent = "Copied"; } catch { copy.textContent = location.href; } };
    const statsHost = el("section", { class: "card stats-card", "aria-live": "polite" }, el("p", { class: "muted", text: `Loading ${d.symbol} token stats…` }));
    const back = el("a", { href: "/nft", class: "back", text: "← All locked NFTs" });
    back.onclick = (ev) => { ev.preventDefault(); history.pushState(null, "", "/nft"); showGallery(); };
    out.replaceChildren(back, el("div", { class: "view" },
      el("div", { class: "art" }, img),
      el("div", {},
        el("h1", { text: d.name }),
        el("span", { class: `pill ${d.printed ? "ok" : "warn"}`, text: d.printed ? "Receipt stored on-chain in the NFT" : "Preview: receipt not printed yet" }),
        el("div", { class: "card" }, el("dl", {}, ...rows.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", {}, v)]))),
        el("div", { class: "actions" }, link(`${d.explorer}/address/${d.nftMint}`, "View on explorer ↗", "btn primary"), download, copy, receiptButton(d)),
        withdrawCard(d),
        el("p", { class: "note", text: d.printed
          ? "The image and details above are read straight from the NFT's on-chain metadata; nothing is hosted."
            + (d.upToDate ? "" : ` The printed receipt is out of date; the wallet that locked (${d.authority ? short(d.authority) : "unknown"}) can update it.`)
          : `This is how the receipt will look. The wallet that locked (${d.authority ? short(d.authority) : "unknown"}) can print it into the NFT from the launch app or the dashboard.` }))), statsHost);
    loadTokenStats(d, statsHost);
  } catch (e) {
    out.replaceChildren(el("p", { class: "error", text: e.message || String(e) }));
  }
}

// ---------- Token stats: burned, liquidity added, payouts, holders ----------
const STATUS = {
  earning: ["Earning", "Receives XNT payouts"],
  "below-minimum": ["Below minimum", "Holds less than the minimum needed for payouts"],
  excluded: ["Excluded", "Pool, distributor, burn address or an excluded wallet"],
  program: ["Program", "Owned by a program, not a wallet"],
  sold: ["Sold", "No longer holds the token, but was paid before"],
};
let holdersShown = 25;
/** Yield numbers: 3 significant digits when small, commas when large. */
const fmtSig = (v) => v === 0 ? "0" : v < 1 ? v.toFixed(Math.min(12, 2 - Math.floor(Math.log10(v)))).replace(/0+$/, "").replace(/\.$/, "") : v.toLocaleString(undefined, { maximumFractionDigits: v < 100 ? 2 : 0 });
function yieldPanel(y, sym, extraNote) {
  if (!y) return null;
  const none = y.per1000PerDay <= 0;
  return el("div", { class: "panel yield-panel" },
    el("div", {}, el("div", { class: "k", text: `Holder yield per 1,000 ${sym}` }),
      el("div", { class: "v", text: none ? "–" : `${fmtSig(y.per1000PerDay)} XNT/day` }),
      el("div", { class: "n", text: none ? "no payouts in this period" : `≈ ${fmtSig(y.xntPerDay)} XNT/day to all holders` })),
    el("div", {}, el("div", { class: "k", text: "Estimated yearly return" }),
      el("div", { class: "v", text: y.aprPct == null ? "–" : `≈ ${fmtSig(y.aprPct)}%` }),
      el("div", { class: "n", text: "at today's price, not compounded" })),
    el("div", { class: "why", text: `Based on XNT paid to holders over the last ${y.windowDays} day${y.windowDays === 1 ? "" : "s"}, split across the tokens that earn payouts now. Payouts follow trading volume, so this changes and isn't guaranteed.${extraNote ?? ""}` }));
}
/** Small prices keep 3 significant digits (0.0000001534), larger ones up to 6 decimals. */
const fmtPrice = (p) => p === 0 ? "0" : p < 0.001 ? p.toFixed(Math.min(18, 2 - Math.floor(Math.log10(p)))) : p.toLocaleString(undefined, { maximumFractionDigits: 6 });
async function loadTokenStats(d, host) {
  try {
    const s = await api(`/api/token/${d.tokenMint}/stats`);
    if (current?.nftMint !== d.nftMint) return; // navigated away meanwhile
    renderTokenStats(d, s, host);
  } catch (e) {
    host.replaceChildren(el("p", { class: "muted", text: `Token stats aren't available: ${e.message || e}` }));
  }
}
function renderTokenStats(d, s, host) {
  const tok = (v, max = 4) => `${fmtUnits(v, s.decimals, max)} ${s.symbol}`;
  // Summary panels: 999.99M instead of 999,999,987.68 so big supplies don't wrap.
  const tokC = (v, max = 2) => { const n = Number(BigInt(v)) / 10 ** s.decimals;
    return `${n >= 1e6 ? n.toLocaleString(undefined, { notation: "compact", maximumFractionDigits: 2 }) : n.toLocaleString(undefined, { maximumFractionDigits: max })} ${s.symbol}`; };
  const xntOf = (v, max = 4) => `${fmtUnits(v, 9, max)} XNT`;
  const pctOf = (part, whole) => (BigInt(whole) > 0n ? Number((BigInt(part) * 1_000_000n) / BigInt(whole)) / 10_000 : 0);
  const pctText = (p, raw) => (BigInt(raw) > 0n && p < 0.01 ? "<0.01%" : `${p.toFixed(2)}%`);
  const me = W.state.address;
  const metric = (k, v, n, cls = "") => el("div", { class: `panel metric ${cls}` }, el("div", { class: "k", text: k }), v instanceof Node ? v : el("div", { class: "v", text: v }), n ? el("div", { class: "n", text: n }) : null);

  // Price, with the change since the launch price.
  let chg = null;
  if (s.priceXnt != null && s.launchPriceXnt) {
    const c = (s.priceXnt / s.launchPriceXnt - 1) * 100;
    chg = el("span", { class: `chg ${c >= 0 ? "up" : "down"}`, text: `${c >= 0 ? "+" : ""}${c.toFixed(1)}% since launch`, title: `Launch price ${fmtPrice(s.launchPriceXnt)} XNT` });
  }

    toast("info", `${label}: preparing and simulating…`);
    const { tx } = await api(url, { nftMint: current.nftMint, holder: W.state.address, authority: W.state.address });
    toast("info", `${label}: approve it in your wallet…`);
    const signed = await W.sign(W.b64ToBytes(tx));
    toast("info", `${label}: sending…`);
    const { signature } = await api("/api/send", { tx: W.bytesToB64(signed) });
    toast("success", `${label} confirmed. `, link(`${current.explorer}/tx/${signature}`, "View transaction ↗"));
  } catch (e) {
    toast("error", `${label} failed: ${e.message || e}`);
  }
  busy = false; show(current.nftMint, true);
}
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let toastTimer;
function toast(kind, ...parts) {
  const t = $("toast"); t.className = `toast ${kind}`; t.replaceChildren(...parts); t.hidden = false;
  clearTimeout(toastTimer); if (kind !== "info") toastTimer = setTimeout(() => { t.hidden = true; }, 9000);
}
function renderWallet() {
  const area = $("walletArea");
  if (W.state.address) {
    const b = el("button", { class: "btn", type: "button", text: "Disconnect" });
    b.onclick = () => W.disconnect();
    area.replaceChildren(el("span", { class: "mono", text: short(W.state.address) }), b);
  } else {
    const b = el("button", { class: "btn primary", type: "button", text: "Connect wallet" });
    b.onclick = openWalletMenu;
    area.replaceChildren(b);
  }
}
function openWalletMenu(ev) {
  ev.stopPropagation();
  $("walletMenu")?.remove();
  const choices = W.choices();
  const go = (c) => W.connect(c).catch((e) => toast("error", "Wallet connection failed: " + (e.message || e)));
  if (!choices.length) { toast("error", "No wallet found. Install a Solana-compatible wallet such as X1 Wallet or Backpack, then reload."); return; }
  if (choices.length === 1) { go(choices[0]); return; }
  const menu = el("div", { class: "wallet-menu", id: "walletMenu" });
  for (const c of choices) {
    const b = el("button", { type: "button" });
    if (typeof c.icon === "string" && c.icon.startsWith("data:image/")) b.append(el("img", { src: c.icon, alt: "" }));
    b.append(c.name);
    b.onclick = () => { menu.remove(); go(c); };
    menu.append(b);
  }
  $("walletArea").append(menu);
}
document.addEventListener("click", () => $("walletMenu")?.remove());
W.onChange(() => {
  renderWallet();
  if (!current) { renderGallery(); return; }
  // Re-reading the NFT for this wallet takes a few seconds (fees come from the chain).
  const wd = document.querySelector(".withdraw");
  if (wd) { wd.querySelectorAll("button").forEach((b) => { b.disabled = true; }); const p = wd.querySelector("p.muted"); if (p) p.textContent = "Checking your wallet…"; }
  show(current.nftMint, true);
});
renderWallet();

$("search").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const m = $("mintInput").value.trim();
  if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(m)) { $("out").replaceChildren(el("p", { class: "error", text: "That doesn't look like a Solana/X1 address." })); return; }
  history.pushState(null, "", `/nft/${m}`);
  show(m);
});
const fromPath = () => { const m = location.pathname.match(/^\/nft\/([1-9A-HJ-NP-Za-km-z]{32,44})$/); if (m) { $("mintInput").value = m[1]; show(m[1]); } else showGallery(); };
window.addEventListener("popstate", fromPath);
fromPath();
</script>
