[package]
name = "lp_locker"
version = "0.1.0"
description = "Locks XDEX LP tokens forever behind a 1-of-1 NFT that can claim the trading fees"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lp_locker"

[features]
default = []
# Build with --features testnet for X1 testnet's XDEX program.
testnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
